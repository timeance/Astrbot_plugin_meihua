name: astrbot_plugin_meihua
display_name: 梅花易数助手
short_desc: 梅花易数本地排盘校验、64 卦知识库解读与连续问卦。
desc: |
  支持直接报数或粘贴排盘文字，本地核对本卦、互卦、变卦与动爻，结合《灵签详解》64 卦知识库生成解读。
  「起卦」沿用当前聊天模型、人设与上下文；「完整起卦」（别名「解卦」）独立输出排盘、命中的原文与分层解读，并支持用「问卦」连续追问。
  支持独立模型供应商与推理等级配置、单用户和单群每日限额与管理员豁免，清理解读回复中的常见 Markdown 标记。
version: "0.2.0"
author: zariba
